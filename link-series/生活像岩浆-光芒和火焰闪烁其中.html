<h1
id="生活像岩浆光芒和火焰闪烁其中">生活像岩浆：光芒和火焰闪烁其中</h1>
<p>生活像岩浆：光芒和火焰闪烁其中<br />
这生活绝非是漆黑的、平庸的煤球。<br />
是光芒和火焰闪烁在其中的、光芒拦不住的、流动的、黑红的岩浆。<br />
自性的光芒，始终照耀我前进，滋养我。<br />
生活常常痛苦难受，业障常常深厚，依然能照顾自己，偶尔宁静。不正体现本我的强大。<br />
以前我寻找光，原来我就是那道光。<br />
心即是佛，我即是光。</p>
