<article>
<p>人生总是充满困难和挑战，状态总是波动，痛苦总会回来。</p>
<p>重要的是不为难自己，照顾自己。</p>
<p>一、空</p>
<p>1.极低外界刺激，简单生机大自然，暗夜安全宁静公园</p>
<p>2.远离杂人</p>
<p>3.极低前额叶刺激，戒屏幕</p>
<p>二、静</p>
<p>苦中作乐，乱中取静，烦中守安</p>
<p>三、安</p>
<p>睡觉，放松，饮食健康清淡规律</p>
<p>庄子云，正静明虚，虚室生白。静安，本我会自然疗愈，滋养自己。</p>
<p>前文：《接纳阴暗面》、《接纳平庸》、《接纳自己境界不行，也是境界》《内在小孩在疗愈我》</p>
