<article>
<p>回首三十多年人生，苦难毫无意义，不是财富。</p>
<p>我只是宣告，苦难没有摧毁和侵蚀我。</p>
<p>我心中开出莲花，结出莲子，散出心香，水面平静如镜。</p>
<p>不再在泥塘中迷失，平凡的莲花当下自在。</p>
<p>过河的小马在我这里有镜子照，有莲子吃，有心香嗅，有莲花赏。</p>
<p>渡河的小马们有没有听到我再次像无数前人一样，用手指月：彼岸就在此刻本心。</p>
<p>没有分别心，只有万物齐一的共鸣，万物都是宇宙的孩子。</p>
<p>这不是个人天才，只是我比其他莲子幸运。</p>
<p>天地不仁，淤泥荷花都只是这一世。</p>
<p>愿你们也心生莲花，小马见性成己。</p>
