<article>
<p>休息本身的哲学，就是停止再用力，停止努力。</p>
<p>接纳自己的边界，有限性，顺其自然。</p>
<p>清静无为。</p>
<p>脑力工作者，常常不擅长休息，不擅长设定边界，总想多学一些，多看一些，多想一些。</p>
<p>背后是全知全能自恋和焦虑不安等等业障。金融行业最常见。</p>
<p>力量需要休息，休息需要力量。</p>
<p>前文《如何解决不允许自己躺平》、《论劳逸结合》</p>
