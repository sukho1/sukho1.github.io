<article>
<p>某个平常的晚上，躺床上，杂念纷飞，情绪翻涌。<br />
此时看到一个小我在忙碌，不断的发出新指令：你应该这样这样，你应该调整呼吸，你应该不要去认同情绪和痛苦，思想不是你，杂念不是你，等等。“听我的，我就是’本我’”。<br />
这个时候，“我”意识到，你不是“本我”。你只是“修行人小我”。<br />
然后“我”看到思想进一步纷飞和混乱，一些胡乱、不合逻辑、超现实的意识流开始切换，我知道，我的大脑已经无比疲惫，就要进入半睡半醒的梦寐期。<br />
关机。</p>
